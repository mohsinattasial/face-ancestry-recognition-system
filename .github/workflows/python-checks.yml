name: Python source and Flask route checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Flask route dependencies
        run: python -m pip install "flask>=3,<4" "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Test the local Flask page without loading the research model
        run: python -m unittest discover -s tests -v
