<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ancestry Engine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
        }
        h1 {
            font-size: 26px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        p { color: #888; margin-bottom: 30px; font-size: 14px; }
        
        input[type="file"] {
            margin-bottom: 20px;
            width: 100%;
            color: #ccc;
        }
        
        .upload-btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            width: 100%;
        }
        .upload-btn:hover { background-color: #cccccc; }
        
        .result-box {
            margin-top: 30px;
            padding: 20px;
            background: #262626;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }
        .result-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .result-value { font-size: 22px; font-weight: bold; color: #00ffcc; margin-top: 5px; }
        
        img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>AI ANCESTRY ENGINE</h1>
        <p>Deep Learning Model Prototype</p>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit" class="upload-btn">Analyze Face</button>
        </form>

        {% if result %}
            <div class="result-box">
                <div class="result-title">AI Prediction</div>
                <div class="result-value">{{ result }}</div>
            </div>
            <img src="{{ image_path }}" alt="Analyzed Face">
        {% endif %}
    </div>

</body>
</html>
